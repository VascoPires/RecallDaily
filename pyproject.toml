[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recalldaily"
version = "1.0.0"
description = "Daily email digest of your e-reader highlights, a free self-hosted alternative to Readwise."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Vasco Pires" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
recalldaily = "recalldaily.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recalldaily = ["templates/*.html", "templates/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Email HTML needs long inline style attributes.
"src/recalldaily/render.py" = ["E501"]
