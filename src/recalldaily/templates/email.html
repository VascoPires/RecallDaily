<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>Recall Daily</title>
    <!-- Same text fonts as vascodcpires.com. Gmail ignores web fonts and falls back to Helvetica/Arial. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; padding: 0; background: #f1f1f1; }
      .card { background: #ffffff; border: 1px solid rgba(0, 0, 0, 0.12); border-radius: 12px; }
      .ink { color: #000000; }
      .muted { color: #828282; }
      .quote { border-left: 3px solid #c7001b; }
      .note { color: #2272a6; }
      .rule { border-bottom: 1px solid rgba(0, 0, 0, 0.22); }
      @media (prefers-color-scheme: dark) {
        body, .bg { background: #1c1c1d !important; }
        .card { background: #212529 !important; border-color: #424246 !important; }
        .ink { color: #e8e8e8 !important; }
        .muted { color: #9a9a9a !important; }
        .quote { border-left-color: #ff4d5e !important; }
        .note { color: #6cb4e6 !important; }
        .rule { border-bottom-color: #424246 !important; }
      }
      @media only screen and (max-width: 640px) {
        .container { width: 100% !important; }
        .pad { padding: 24px 18px !important; }
      }
    </style>
  </head>
  <body>
    <span style="display:none;max-height:0;overflow:hidden;opacity:0;">$preheader</span>
    <table role="presentation" class="bg" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background:#f1f1f1;">
      <tr>
        <td align="center" style="padding:28px 8px;">
          <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0"
                 border="0" style="width:600px;max-width:600px;">
            <tr>
              <td class="card pad" style="padding:36px 40px;background:#ffffff;border:1px solid rgba(0,0,0,0.12);border-radius:12px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="line-height:0;">
                      <!-- Sedgwick Ave title as an inline image: Gmail ignores web fonts. Alt text keeps the colour if images are off. -->
                      <img src="$title_src" width="207" height="58" alt="Recall Daily"
                           style="display:block;border:0;outline:none;text-decoration:none;font-family:Georgia,serif;font-size:32px;font-weight:bold;line-height:58px;color:#e5233a;">
                    </td>
                    <td class="muted" align="right" valign="bottom" style="font-family:Inter,Manrope,Helvetica,Arial,sans-serif;font-size:14px;color:#828282;padding-bottom:6px;">
                      $date
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2" class="muted rule" style="padding:8px 0 14px;border-bottom:1px solid rgba(0,0,0,0.22);font-family:Manrope,Inter,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#828282;">
                      $count to revisit today
                    </td>
                  </tr>
                </table>
                $quotes
              </td>
            </tr>
            <tr>
              <td class="muted" align="center" style="padding:20px 0;font-family:Inter,Manrope,Helvetica,Arial,sans-serif;font-size:13px;color:#828282;">
                $footer
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
