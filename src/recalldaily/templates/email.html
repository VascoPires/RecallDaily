<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>Recall Daily</title>
    <style>
      body { margin: 0; padding: 0; background: #f4f1ea; }
      .card { background: #fffdf8; border: 1px solid #e7e1d4; border-radius: 14px; }
      .ink { color: #2b2620; }
      .muted { color: #8a8174; }
      .quote { border-left: 4px solid #c7001b; background: #faf6ee; }
      .note { background: #f1ebdf; color: #4f473c; }
      @media (prefers-color-scheme: dark) {
        body, .bg { background: #17150f !important; }
        .card { background: #211e18 !important; border-color: #3a352c !important; }
        .ink { color: #ece6da !important; }
        .muted { color: #a59c8d !important; }
        .quote { background: #2a261f !important; border-left-color: #ff4d5e !important; }
        .note { background: #332e26 !important; color: #d6cebf !important; }
        .rule { border-bottom-color: #3a352c !important; }
      }
      @media only screen and (max-width: 640px) {
        .container { width: 100% !important; }
        .pad { padding: 20px 16px !important; }
      }
    </style>
  </head>
  <body>
    <span style="display:none;max-height:0;overflow:hidden;opacity:0;">$preheader</span>
    <table role="presentation" class="bg" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background:#f4f1ea;">
      <tr>
        <td align="center" style="padding:24px 8px;">
          <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0"
                 border="0" style="width:600px;max-width:600px;">
            <tr>
              <td class="card pad" style="padding:32px;background:#fffdf8;border:1px solid #e7e1d4;border-radius:14px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td class="ink" style="font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:bold;color:#2b2620;">
                      Recall Daily
                    </td>
                    <td class="muted" align="right" style="font-family:Helvetica,Arial,sans-serif;font-size:15px;color:#8a8174;">
                      $date
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2" class="muted rule" style="padding:6px 0 8px;border-bottom:1px solid #e7e1d4;font-family:Helvetica,Arial,sans-serif;font-size:14px;color:#8a8174;">
                      $count to revisit today
                    </td>
                  </tr>
                </table>
                $quotes
              </td>
            </tr>
            <tr>
              <td class="muted" align="center" style="padding:20px 0;font-family:Helvetica,Arial,sans-serif;font-size:13px;color:#8a8174;">
                $footer
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
